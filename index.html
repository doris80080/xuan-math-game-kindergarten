<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffd8ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>企鵝妹的數學遊戲｜中大班版</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#f8dff0;color:#68452f;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif}
button{font:inherit;border:0;cursor:pointer}
.app{width:100%;max-width:900px;margin:auto;min-height:100vh;background:#fff8fc}
.home{padding-bottom:30px;background:linear-gradient(#fff2f8,#fff9fd 38%,#f8efff)}
.hero{position:relative;width:100%;aspect-ratio:2/3;background:url("xuan-kindergarten-princess.webp") center/cover no-repeat;overflow:hidden;border-radius:0 0 34px 34px;box-shadow:0 8px 25px #8c507722}
.heroHot{position:absolute;z-index:8;background:transparent;border-radius:18px;transition:.15s}
.settingsHot{left:2.5%;top:1.5%;width:12.5%;height:8.5%}.randomHot{left:14%;top:1.5%;width:13%;height:8.5%}
.heroHot:active{background:#ffffff2e;transform:scale(.97)}
.sceneMap{position:absolute;left:2.2%;right:2.2%;top:24.4%;height:68.8%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(5,1fr);column-gap:2.2%;row-gap:2.2%;z-index:7}
.sceneHot{position:relative;display:block;border:0;background:transparent;border-radius:28px;min-width:0;min-height:0;box-shadow:none}
.sceneHot::after{content:"▶ 點我玩";position:absolute;left:50%;bottom:7%;transform:translate(-50%,10px);padding:6px 13px;border-radius:999px;background:#ff77a8e8;color:#fff;font-size:12px;font-weight:1000;opacity:0;transition:.18s;white-space:nowrap;box-shadow:0 4px 10px #8b3e5c30}
.sceneHot:hover{background:#ffffff18;box-shadow:inset 0 0 0 4px #ffffff99,0 0 18px #fff8}
.sceneHot:hover::after{opacity:1;transform:translate(-50%,0)}
.sceneHot:active{transform:scale(.98);background:#ffffff25}
.sceneHint{position:absolute;left:4%;right:4%;bottom:1.2%;text-align:center;color:#a04c79;font-size:12px;font-weight:900;background:#ffffffb8;border-radius:18px;padding:6px 9px;backdrop-filter:blur(5px);z-index:9}
.card{position:relative;min-height:178px;border-radius:24px;padding:11px 9px 10px;border:3px solid #fff;box-shadow:0 7px 16px #754a6519;overflow:hidden;background:linear-gradient(145deg,#fff,#ffeaf4)}
.card:nth-child(3n+1){background:linear-gradient(145deg,#fff5cc,#ffe4ef)}.card:nth-child(3n+2){background:linear-gradient(145deg,#e8f8ff,#f5e7ff)}.card:nth-child(3n){background:linear-gradient(145deg,#eaffef,#fff0c9)}
.card:active{transform:scale(.98)}
.num{position:absolute;left:9px;top:7px;width:31px;height:31px;border-radius:11px;background:#ff77a7;color:#fff;display:grid;place-items:center;font-size:19px;font-weight:1000;box-shadow:0 3px 7px #9b42652c}
.card:nth-child(3n+2) .num{background:#7d75d9}.card:nth-child(3n) .num{background:#63b968}
.cardEmoji{font-size:39px;text-align:center;margin:7px 0 1px;min-height:45px;letter-spacing:3px}.card h2{margin:0;text-align:center;color:#7c3e62;font-size:17px;font-weight:1000;line-height:1.25}.card p{margin:5px 2px 8px;text-align:center;color:#8f6d7d;font-size:11px;font-weight:800;min-height:28px}
.start{display:block;width:100%;border-radius:18px;padding:8px 4px;background:linear-gradient(135deg,#ff77a8,#c889ee);color:#fff;font-size:13px;font-weight:1000;box-shadow:0 4px 9px #a5537a30}
.badge{display:inline-block;margin:3px auto 0;padding:3px 8px;border-radius:10px;background:#ffffffaa;color:#a35a7c;font-size:10px;font-weight:1000}
.gamePage{display:none;min-height:100vh;background:linear-gradient(#fff4fa,#f4edff)}
.gameTop{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:7px;padding:10px 12px;background:#fff8fcf0;backdrop-filter:blur(9px);border-bottom:2px solid #f2d4e2}
.backTop,.settingsTop{border-radius:15px;background:#fff;padding:10px 11px;color:#9d5075;font-weight:1000;box-shadow:0 4px 12px #7d4f6422}.gameTitle{text-align:center;font-weight:1000;color:#b84e7b;font-size:17px}.gameScore{background:#fff0b9;border-radius:15px;padding:9px 10px;font-weight:1000;color:#8a4b16;white-space:nowrap}
.questionArea{padding:12px 14px 30px}.scene{background:#fffafc;border:4px solid #fff;border-radius:30px;padding:14px;box-shadow:0 10px 26px #865c7820;overflow:hidden}.sceneTop{min-height:180px;border-radius:24px;background:radial-gradient(circle at 30% 20%,#fff 0 5%,transparent 6%),linear-gradient(135deg,#ffe4f0,#e9f5ff 55%,#f4e7ff);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.sceneTop:before,.sceneTop:after{content:"✦";position:absolute;color:#efb8d2;font-size:28px}.sceneTop:before{left:10%;top:13%}.sceneTop:after{right:11%;bottom:13%}.sceneEmoji{font-size:65px;letter-spacing:6px;z-index:1}.speech{text-align:center;color:#a24d75;font-size:16px;font-weight:1000;margin:10px 4px 3px}.question{font-size:24px;line-height:1.5;font-weight:1000;text-align:center;min-height:104px;display:flex;align-items:center;justify-content:center;padding:7px 4px;color:#6d452e;white-space:pre-line}.answers{display:grid;grid-template-columns:1fr 1fr;gap:11px}.ans{min-height:66px;border-radius:20px;background:linear-gradient(#fff,#fff0f6);border:3px solid #f5d6e5;color:#7a4d67;font-size:22px;font-weight:1000;box-shadow:0 5px 12px #805a7418}.ans.ok{background:#e7faef;border-color:#8bd6a8}.ans.no{background:#fff0f0;border-color:#efaaaa;animation:shake .25s}.feedback{text-align:center;min-height:58px;padding:10px 4px 0;font-weight:1000;color:#b44f78;font-size:18px}.feedback small{display:block;color:#916d80;font-size:13px;margin-top:3px}.actions{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px}.btn{border-radius:17px;padding:12px 5px;background:#f0e3f8;color:#684c70;font-weight:1000}.primary{background:linear-gradient(135deg,#ff82ad,#c99bed);color:#fff}.backHome{display:block;width:100%;margin-top:12px;background:#fff;border:2px solid #efd4e1;color:#9a5b7b;border-radius:17px;padding:12px;font-weight:1000}
.modal{display:none;position:fixed;inset:0;background:#5d415b66;z-index:50;align-items:flex-end;justify-content:center}.modal.show{display:flex}.modalBox{width:min(460px,100%);max-height:84vh;overflow:auto;background:#fff8fc;border-radius:30px 30px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -10px 35px #4d334a33}.modalHead{display:flex;justify-content:space-between;align-items:center;color:#bd4e7c;font-size:21px;font-weight:1000}.close{width:38px;height:38px;border-radius:50%;background:#f1e4ed;color:#76536c;font-size:22px}.line{display:flex;justify-content:space-between;align-items:center;padding:14px 4px;border-bottom:2px dashed #f0cada;font-weight:900}.tiny{color:#977486;font-size:12px;text-align:center;line-height:1.6}.audioRow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 4px;border-bottom:2px dashed #f0cada}.toggle{position:relative;width:58px;height:32px;border-radius:20px;background:#d8cbd4;transition:.2s;flex:0 0 auto}.toggle:after{content:"";position:absolute;width:26px;height:26px;top:3px;left:3px;border-radius:50%;background:#fff;box-shadow:0 2px 5px #0002;transition:.2s}.toggle.on{background:linear-gradient(135deg,#ff83ad,#c99bed)}.toggle.on:after{left:29px}.audioLabel{font-weight:1000;color:#704b63}.audioActions{display:flex;gap:8px;margin:10px 0 4px}.soundTest{border:0;border-radius:14px;padding:10px 12px;background:#fff1f7;color:#7d4c67;font-weight:900;box-shadow:0 2px 8px #00000010}.musicTest{background:linear-gradient(135deg,#fff2b8,#ffd9ec)}.audioStatus{font-size:12px;color:#9a7185;text-align:center;padding:8px 4px 12px}.audioSub{font-size:12px;color:#a08393;margin-top:2px}
.reward{display:none;position:fixed;inset:0;background:#fff2f8f2;z-index:60;align-items:center;justify-content:center;padding:20px}.reward.show{display:flex}.rewardBox{width:min(390px,100%);background:#fff;border:4px solid #ffd5e5;border-radius:30px;padding:22px;text-align:center;box-shadow:0 18px 50px #70486130}.dance{font-size:64px;animation:dance .55s infinite alternate ease-in-out}.starsFx{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden}.fly{position:absolute;font-size:30px;animation:fly .9s ease-out forwards}@keyframes fly{0%{opacity:0;transform:scale(.3) translate(0,0)}20%{opacity:1}100%{opacity:0;transform:scale(1.3) translate(var(--x),var(--y))}}@keyframes dance{from{transform:translateY(7px) rotate(-7deg)}to{transform:translateY(-8px) rotate(7deg)}}@keyframes shake{0%,100%{transform:translateX(0)}35%{transform:translateX(-5px)}70%{transform:translateX(5px)}}
@media(max-width:680px){.app{width:100vw;max-width:none}.home{padding-bottom:0}.hero{width:100vw;border-radius:0;box-shadow:none}.gameGrid{grid-template-columns:repeat(2,1fr);gap:10px}.card{min-height:175px}.card h2{font-size:16px}.heroNote{font-size:11px}.question{font-size:22px}.sceneTop{min-height:155px}}
@media(max-width:390px){.gameGrid{grid-template-columns:1fr 1fr}.card{min-height:165px}.cardEmoji{font-size:34px}.card h2{font-size:15px}.start{font-size:12px}}
</style>
</head>
<body>
<div class="app">
<section class="home" id="homePage">
  <div class="hero" aria-label="企鵝妹的數學遊戲中大班版首頁">
    <button class="heroHot settingsHot" aria-label="設定" onclick="openSettings()"></button>
    <button class="heroHot randomHot" aria-label="隨機出題" onclick="randomGame()"></button>
    <div class="sceneMap" aria-label="15 個情境式數學遊戲">
      <button class="sceneHot" aria-label="1 動物加加樂" onclick="playScene(0)"></button>
      <button class="sceneHot" aria-label="2 誰比較多" onclick="playScene(1)"></button>
      <button class="sceneHot" aria-label="3 小兔子跑掉了" onclick="playScene(2)"></button>
      <button class="sceneHot" aria-label="4 神秘數字" onclick="playScene(3)"></button>
      <button class="sceneHot" aria-label="5 數字接龍" onclick="playScene(4)"></button>
      <button class="sceneHot" aria-label="6 媽媽說對嗎" onclick="playScene(5)"></button>
      <button class="sceneHot" aria-label="7 水果分類" onclick="playScene(6)"></button>
      <button class="sceneHot" aria-label="8 排排隊" onclick="playScene(7)"></button>
      <button class="sceneHot" aria-label="9 形狀小偵探" onclick="playScene(8)"></button>
      <button class="sceneHot" aria-label="10 位置小高手" onclick="playScene(9)"></button>
      <button class="sceneHot" aria-label="11 規律接龍" onclick="playScene(10)"></button>
      <button class="sceneHot" aria-label="12 公平分一分" onclick="playScene(11)"></button>
      <button class="sceneHot" aria-label="13 數一數" onclick="playScene(12)"></button>
      <button class="sceneHot" aria-label="14 數字鄰居" onclick="playScene(13)"></button>
      <button class="sceneHot" aria-label="15 多一個少一個" onclick="playScene(14)"></button>
    </div>
    <div class="sceneHint">👑 每一幅情境插畫都可以直接點擊開始遊戲！</div>
  </div>
</section>

<section class="gamePage" id="gamePage">
  <div class="gameTop"><button class="backTop" onclick="goHome()">← 回首頁</button><div class="gameTitle" id="gameTitle">數學遊戲</div><div class="gameScore">⭐ <span id="gameScore">0</span></div></div>
  <div class="questionArea"><div class="scene"><div class="sceneTop"><div class="sceneEmoji" id="sceneEmoji">🐧 👑</div></div><div class="speech" id="speech">公主企鵝陪你一起想想看！</div><div class="question" id="question"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><div class="actions"><button class="btn" onclick="hint()">💡 提示</button><button class="btn" onclick="speakQuestion()">🔊 聽題目</button><button class="btn primary" onclick="nextQuestion()" id="nextBtn">下一題 →</button></div><button class="backHome" onclick="goHome()">🏰 回到數學城堡</button></div></div>
</section>
</div>

<div class="modal" id="settingsModal"><div class="modalBox"><div class="modalHead"><span>⚙️ 公主城堡設定</span><button class="close" onclick="closeSettings()">×</button></div><div class="line"><span>每日目標</span><strong>5 題</strong></div><div class="line"><span>目前星星</span><strong>⭐ <span id="settingsStars">0</span></strong></div><div class="line"><span>今日完成</span><strong><span id="settingsDone">0</span> / 5</strong></div><div class="audioRow"><div><div class="audioLabel">🎵 可愛背景配樂</div><div class="audioSub">輕柔、不吵鬧的兒童旋律</div></div><button id="musicToggle" class="toggle on" onclick="toggleMusic()"></button></div><div class="audioActions"><button class="soundTest musicTest" onclick="playMusicNow()">▶ 立即播放配樂</button><button class="soundTest" onclick="testSfx()">🔔 試聽音效</button></div><div class="audioStatus" id="audioStatus">🎵 點「立即播放配樂」即可開始聽音樂</div><div class="audioRow"><div><div class="audioLabel">🔔 遊戲音效</div><div class="audioSub">答對、答錯、按鈕與完成獎勵音效</div></div><button id="sfxToggle" class="toggle on" onclick="toggleSfx()"></button></div><p class="tiny">這是獨立的新版本，使用新的儲存紀錄，不會影響原本的 V4.8。</p><button class="backHome" onclick="closeSettings()">完成</button></div></div>
<div class="reward" id="reward"><div class="rewardBox"><div class="dance">🐧 👑 ✨</div><h2>數學公主太厲害了！🎉</h2><p>今天的 5 題挑戰完成！</p><button class="btn primary" onclick="closeReward()">收下星星 ⭐</button></div></div>
<div class="starsFx" id="starsFx"></div>

<script>
const games=[
 ['動物加加樂','🐧 🐰','10 以內加法','加法入門'],
 ['誰比較多？','🍓 🍎','數量比較','多、少、一樣多'],
 ['小兔子跑掉了','🐰 🏃','10 以內減法','減法入門'],
 ['神秘數字','🔎 ❓','前一個、下一個','數字鄰居'],
 ['數字接龍','🚂 1 2 3 ❓','找規律數列','每次多 1 或 2'],
 ['媽媽說對嗎？','👧 🐧','判斷算式對錯','加減概念'],
 ['水果分類','🍎 🍌 🍇','分類與集合','生活數學'],
 ['排排隊','🐘 🧸 🐰','順序與位置','前面、後面'],
 ['形狀小偵探','🔺 ⚪ ⭐','認識基本形狀','形狀辨識'],
 ['位置小高手','📦 🧸 🚗','空間位置','上、下、裡面'],
 ['規律接龍','⭐ 💗 ⭐ ❓','圖形規律','找下一個'],
 ['公平分一分','🐰 🍪 🐧','平均分配','一人一樣多'],
 ['數一數','🐧 🐟 🎣','數量 1～10','數數不漏數'],
 ['數字鄰居','🏠 3 4 5','前後數字','找左右鄰居'],
 ['多一個少一個','🎈 3 → ❓','數量變化','多 1、少 1']
];
let state=JSON.parse(localStorage.getItem('xuanKindergartenState')||'{}');
state.stars=state.stars||0;state.today=state.today||new Date().toISOString().slice(0,10);state.done=state.done||0;state.musicOn=state.musicOn!==false;state.sfxOn=state.sfxOn!==false;
if(state.today!==new Date().toISOString().slice(0,10)){state.today=new Date().toISOString().slice(0,10);state.done=0;save()}
let current=0,q=0,answered=false,currentQ=null;
const $=id=>document.getElementById(id);function save(){localStorage.setItem('xuanKindergartenState',JSON.stringify(state))}
function playScene(i){sfx('tap');startGame(i)}
function goHome(){sfx('tap');$('homePage').style.display='block';$('gamePage').style.display='none';window.scrollTo(0,0)}
function startGame(i){current=i;q=0;answered=false;$('homePage').style.display='none';$('gamePage').style.display='block';$('gameTitle').textContent=games[i][0];newQuestion();window.scrollTo(0,0)}
function randomGame(){sfx('tap');startGame(Math.floor(Math.random()*games.length))}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(ans,min,max){let s=new Set([String(ans)]);while(s.size<4)s.add(String(rand(min,max)));return [...s].sort(()=>Math.random()-.5)}
function makeQuestion(i){
 let a,b,ans,choices,text,hintText;
 if(i===0){a=rand(1,5);b=rand(1,5);ans=a+b;text=`🐰 有 ${a} 隻小兔子，🐧 又來了 ${b} 隻。\n一共有幾隻？`;choices=pick(ans,1,10);hintText='把兩組小動物合在一起數。'}
 else if(i===1){a=rand(1,9);b=rand(1,9);ans=a>b?'左邊':a<b?'右邊':'一樣多';text=`左邊有 ${a} 個 🍓，右邊有 ${b} 個 🍎。\n哪一邊比較多？`;choices=['左邊','右邊','一樣多'];hintText='先比較兩邊的數字。'}
 else if(i===2){a=rand(4,10);b=rand(1,a-1);ans=a-b;text=`🐰 草地上有 ${a} 隻兔子，跑走 ${b} 隻。\n還剩幾隻？`;choices=pick(ans,0,10);hintText=`從 ${a} 開始往回數 ${b} 次。`}
 else if(i===3){a=rand(2,9);const dir=Math.random()<.5?1:-1;ans=a+dir;text=`神秘數字比 ${a} ${dir===1?'大':'小'} 1。\n它是？`;choices=pick(ans,1,10);hintText=`想一想 ${a} 的下一個或前一個數字。`}
 else if(i===4){a=rand(1,6);const step=Math.random()<.5?1:2;ans=a+step*3;text=`數字排成：${a}、${a+step}、${a+step*2}、？\n下一個是？`;choices=pick(ans,1,15);hintText=`看看每次增加多少。`}
 else if(i===5){a=rand(1,5);b=rand(1,5);const op=Math.random()<.5?'+':'-';let real=op==='+'?a+b:a-b;let shown=real+(Math.random()<.5?0:rand(1,2));ans=shown===real?'對':'不對';text=`媽媽說：${a} ${op} ${b} = ${shown}\n她說對嗎？`;choices=['對','不對'];hintText='把算式自己算一次，再和媽媽的答案比一比。'}
 else if(i===6){const target=Math.random()<.5?'水果':'玩具';ans=target==='水果'?'🍎、🍌、🍇':'🧸、🚗';text=`把${target}找出來：\n🍎 🍌 🧸 🍇 🚗`;choices=['🍎、🍌、🍇','🧸、🚗','🍎、🧸','🍌、🚗'];hintText='想想哪些東西是水果，哪些是玩具。'}
 else if(i===7){ans='小象';text='小兔子在小熊前面。\n小熊又在小象前面。\n誰排在最後面？';choices=['小兔子','小熊','小象'];hintText='把三隻動物想像成一列排隊。'}
 else if(i===8){const shapes=[['🔺','三角形'],['⚪','圓形'],['⭐','星形'],['⬛','正方形']];const t=shapes[rand(0,3)];ans=t[0];text=`哪一個是「${t[1]}」？`;choices=shapes.map(x=>x[0]);hintText='看看每個圖形的外框。'}
 else if(i===9){const places=['上面','下面','裡面'];ans=places[rand(0,2)];text=`想像一個箱子 📦。\n小熊 🧸 在箱子的「${ans}」。\n哪個位置是題目說的？`;choices=places;hintText='想像小熊和箱子的相對位置。'}
 else if(i===10){const patterns=[['⭐','💗'],['🐰','🐧'],['🍎','🍌']];const p=patterns[rand(0,2)];ans=p[1];text=`${p[0]} ${p[1]} ${p[0]} ${p[1]} ${p[0]} ？\n下一個是？`;choices=[p[0],p[1],'🐰','⭐'].filter((v,j,a)=>a.indexOf(v)===j);while(choices.length<4)choices.push('🍎');hintText='看看兩種圖案是不是輪流出現。'}
 else if(i===11){const per=rand(2,4),groups=2;ans=per;text=`有 ${per*groups} 塊 🍪，公平分給 2 隻小動物。\n每隻可以拿幾塊？`;choices=pick(ans,1,5);hintText='一塊一塊輪流分，兩邊要一樣多。'}
 else if(i===12){a=rand(3,10);ans=a;const icons='🐧'.repeat(a);text=`請慢慢數：\n${icons}\n一共有幾隻企鵝？`;choices=pick(ans,1,10);hintText='用手指一隻一隻數，不要漏掉。'}
 else if(i===13){a=rand(2,9);ans=`${a-1} 和 ${a+1}`;text=`數字 ${a} 的左右鄰居是誰？`;choices=[`${a-1} 和 ${a+1}`,`${a-2} 和 ${a+2}`,`${a} 和 ${a+1}`,`${a-1} 和 ${a}`];hintText=`找出 ${a} 前面一個、後面一個數字。`}
 else {a=rand(1,9);const plus=Math.random()<.5;ans=plus?a+1:a-1;text=`${a} ${plus?'多一個':'少一個'}是多少？`;choices=pick(ans,0,10);hintText=`想一想 ${a} 的下一個或前一個數字。`}
 return {text,choices,ans,hintText};
}
function newQuestion(){answered=false;currentQ=makeQuestion(current);$('sceneEmoji').textContent=games[current][1]+' 👑';$('question').textContent=currentQ.text;$('feedback').innerHTML='';$('nextBtn').textContent='下一題 →';const box=$('answers');box.innerHTML='';currentQ.choices.forEach(c=>{const b=document.createElement('button');b.className='ans';b.textContent=c;b.onclick=()=>answer(c,b);box.appendChild(b)});$('gameScore').textContent=state.stars}
function answer(c,btn){if(answered)return;ensureAudio();const ok=String(c)===String(currentQ.ans);if(ok){answered=true;sfx('correct');btn.classList.add('ok');state.stars++;state.done=Math.min(5,state.done+1);save();$('gameScore').textContent=state.stars;$('feedback').innerHTML='答對了！⭐ 太棒了！<small>公主企鵝為你鼓掌！</small>';stars();if(state.done===5)setTimeout(()=>{$('reward').classList.add('show');sfx('reward')},650)}else{sfx('wrong');btn.classList.add('no');$('feedback').innerHTML='沒關係，再想一下 💕<small>'+currentQ.hintText+'</small>'}}
function nextQuestion(){sfx('tap');if(!answered){$('feedback').innerHTML='先選一個答案試試看喔！💗';return}q++;if(q>=5)q=0;newQuestion()}
function hint(){sfx('tap');$('feedback').innerHTML='💡 '+currentQ.hintText}
function speakQuestion(){sfx('tap');if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(currentQ.text);u.lang='zh-TW';u.rate=.88;speechSynthesis.speak(u)}}
function stars(){const f=$('starsFx');for(let i=0;i<12;i++){const s=document.createElement('div');s.className='fly';s.textContent=i%2?'💗':'⭐';s.style.left=(35+Math.random()*30)+'%';s.style.top=(45+Math.random()*20)+'%';s.style.setProperty('--x',(Math.random()*220-110)+'px');s.style.setProperty('--y',(-80-Math.random()*180)+'px');f.appendChild(s);setTimeout(()=>s.remove(),950)}}
let audioCtx=null,masterGain=null,musicTimer=null,musicStep=0,musicOn=state.musicOn!==false,sfxOn=state.sfxOn!==false;const melody=[72,76,79,76,74,76,79,83,81,79,76,74,72,76,79,83];const chords=[[60,64,67],[60,64,67],[57,60,64],[57,60,64],[65,69,72],[65,69,72],[53,57,60],[53,57,60]];const noteHz=n=>440*Math.pow(2,(n-69)/12);
async function ensureAudio(){if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;audioCtx=new AC();masterGain=audioCtx.createGain();masterGain.gain.value=.9;masterGain.connect(audioCtx.destination)}if(audioCtx.state==='suspended'){try{await audioCtx.resume()}catch(e){}}return audioCtx}
function softTone(freq,dur,vol,type='sine',delay=0){if(!audioCtx||!masterGain)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain(),f=audioCtx.createBiquadFilter();o.type=type;o.frequency.value=freq;f.type='lowpass';f.frequency.value=2600;f.Q.value=.4;const t=audioCtx.currentTime+delay;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.001,vol),t+.07);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(f);f.connect(g);g.connect(masterGain);o.start(t);o.stop(t+dur+.05)}
function sfx(kind){if(!sfxOn)return;ensureAudio();if(!audioCtx)return;if(kind==='tap')softTone(noteHz(84),.06,.012);if(kind==='correct'){softTone(noteHz(76),.12,.025);softTone(noteHz(81),.15,.025,'sine',.09);softTone(noteHz(84),.2,.028,'triangle',.19)}if(kind==='wrong'){softTone(noteHz(67),.12,.016);softTone(noteHz(64),.18,.014,'sine',.11)}if(kind==='reward')[72,76,79,84,88].forEach((n,i)=>softTone(noteHz(n),.2,.024,'triangle',i*.09))}
async function startMusic(){if(!musicOn||musicTimer)return;const ctx=await ensureAudio();if(!ctx||ctx.state!=='running')return;musicStep=0;musicTimer=setInterval(()=>{if(!musicOn){stopMusic();return}const n=melody[musicStep%melody.length];softTone(noteHz(n),.42,.018,'triangle');if(musicStep%2===0)chords[Math.floor(musicStep/2)%chords.length].forEach((x,i)=>softTone(noteHz(x-12),.82,.005,'sine',i*.018));musicStep++},520)}
function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}}
async function playMusicNow(){musicOn=true;state.musicOn=true;save();syncAudioUI();await ensureAudio();await startMusic();$('audioStatus').textContent=musicTimer?'🎵 正在播放輕柔兒童配樂':'🎵 請再點一次播放'}
async function toggleMusic(){musicOn=!musicOn;state.musicOn=musicOn;save();syncAudioUI();if(musicOn){await startMusic();sfx('tap');$('audioStatus').textContent='🎵 輕柔背景配樂已開啟'}else{stopMusic();$('audioStatus').textContent='🔇 背景配樂已關閉'}}
async function toggleSfx(){sfxOn=!sfxOn;state.sfxOn=sfxOn;save();syncAudioUI();if(sfxOn){await ensureAudio();$('audioStatus').textContent='🔔 遊戲音效已開啟';sfx('tap')}else $('audioStatus').textContent='🔕 遊戲音效已關閉'}
async function testSfx(){sfxOn=true;state.sfxOn=true;save();syncAudioUI();await ensureAudio();sfx('correct');$('audioStatus').textContent='🔔 音效播放中！'}
function syncAudioUI(){$('musicToggle').classList.toggle('on',musicOn);$('sfxToggle').classList.toggle('on',sfxOn)}
function openSettings(){sfx('tap');syncAudioUI();$('settingsStars').textContent=state.stars;$('settingsDone').textContent=state.done;$('audioStatus').textContent=musicOn?(musicTimer?'🎵 輕柔背景音樂播放中':'🎵 配樂已開啟，點「立即播放配樂」即可聽'):'🔇 背景配樂目前關閉';$('settingsModal').classList.add('show')}
function closeSettings(){sfx('tap');$('settingsModal').classList.remove('show')}function closeReward(){sfx('tap');$('reward').classList.remove('show')}

</script>
